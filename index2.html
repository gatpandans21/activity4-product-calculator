<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Price Calculator</title>
</head>
<body>

    <h1>Product Price Calculator</h1>

    <form action="calculate.php" method="POST">

        <label for="product_name">Product Name:</label>
        <input type="text" id="product_name" name="product_name" value="Laptop_Bag" required>

        <br><br>

        <label for="cost_price">Cost Price:</label>
        <input type="number" id="cost_price" name="cost_price" value="1000" step="0.01" min="0" required>

        <br><br>

        <label for="markup">Markup Percentage (%):</label>
        <input type="number" id="markup" name="markup" value="30" step="0.01" min="0" required>

        <br><br>

        <input type="submit" value="Calculate">

    </form>

</body>
</html>
